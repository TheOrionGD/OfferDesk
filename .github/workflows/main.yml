name: Build AAB Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and Build with Gradle
        run: |
          # This automatically finds the folder containing the project files
          GRADLE_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          echo "Found project folder at: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          gradle bundleRelease

      - name: Upload Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: |
            **/build/outputs/bundle/release/*.aab
