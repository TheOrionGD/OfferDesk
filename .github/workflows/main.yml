name: Build AAB Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies and Build Assets
        run: |
          cd app
          npm install
          npm run build --if-present
          npx cap sync

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Legacy Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Enable Multi-Dex and Configure Build Properties
        run: |
          mkdir -p ~/.gradle
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
          
          # Force multi-dex support into the app's build rules
          sed -i '/defaultConfig {/a \        multiDexEnabled true' app/android/app/build.gradle

      - name: Create Auto-Signing Key
        run: |
          keytool -genkey -v -keystore app/android/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass mypassword -keypass mypassword -dname "CN=App, OU=Dev, O=Company, L=City, S=State, C=US"

      - name: Build Signed AAB
        run: |
          cd app/android
          gradle bundleRelease -Pandroid.injected.signing.store.file=../release-key.jks -Pandroid.injected.signing.store.password=mypassword -Pandroid.injected.signing.key.alias=my-alias -Pandroid.injected.signing.key.password=mypassword

      - name: Upload Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: |
            **/build/outputs/bundle/release/*.aab
